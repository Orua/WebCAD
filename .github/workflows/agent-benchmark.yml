name: Agent benchmark framework
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'webcad-skills/benchmark/**'
      - 'webcad-skills/scripts/model-session.mjs'
      - 'package.json'
      - '.github/workflows/agent-benchmark.yml'
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:agent-benchmark:selftest
      - run: npm run test:agent-benchmark -- --help
